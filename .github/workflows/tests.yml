name: tests

on:
  push:
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ruff
        # Take the version from requirements-dev.txt so local runs and CI
        # cannot drift apart. Linting needs nothing else, so the heavy
        # scientific stack is skipped here.
        run: pip install "$(grep -i '^ruff' requirements-dev.txt)"

      - name: Lint
        # Rules live in ruff.toml. GitHub format puts any finding inline on
        # the diff rather than only in the log.
        run: ruff check --output-format=github

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the README claims; 3.13 is what development uses.
        # Testing both keeps that claim honest.
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Show resolved versions
        run: pip list | grep -Ei 'scikit-learn|pandas|numpy|streamlit|scipy'

      - name: Run the test suite
        run: pytest
